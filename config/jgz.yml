# Configuration for the JGZ (youth health care) cohort: children with JGZ
# measurements (project 8151), one row per child, with the JGZ outcomes per age.
#
# Run like every other cohort, from the repository root:
#   Rscript P_2_1_run_all.R jgz                       # all steps
#   Rscript src/lib/P_2_1_run_cohort.R jgz 03 04      # only steps 03 and 04
# The steps (01a-d cohort, 02 predictors, 03 outcomes, 04 postprocessing) are
# listed under `pipeline` below. Output: output/jgz_cohort.rds.
#
# The catchment sample for the bereik (take-up) outcomes is a separate cohort
# with its own config: config/jgz_catchment.yml. The analysis and export
# scripts (map tables, gradients, export bundle) are in
# Opportunity-Analysis-Map/JGZ with their own config.

default:
  data_preparation:
    cohort_name: "jgz"

    # --- 01a_clean_and_merge.R -----------------------------------------------
    # CBS stand-in hash for an empty child ID (confirmed with CBS, see Coen's
    # do-file). Rows in the ID file with this value are dropped. Set to "" to
    # disable.
    placeholder_hash: "07a6b530b148d85858a02420de14c297"

    # Category-3 ("fill empty") variables that are strings: the Stata do-file
    # fills with the first sorted value, which is "" whenever any row in the
    # contact moment is empty -- i.e. it blanks real values instead of
    # filling them. FALSE (default) fills with the group's non-empty value,
    # as intended. TRUE reproduces the Stata behaviour exactly.
    replicate_stata_string_fill: FALSE

    # --- 01d_cohort_jgz.R ----------------------------------------------------
    # Children in the JGZ panel born in this range form the cohort (the JGZ
    # data cover registrations 2009-2018; Coen's samples: born 2005-2018).
    child_birth_date_min: "01/01/2005"
    child_birth_date_max: "31/12/2018"

    # --- 02 predictors: src/newborns/02_predictors_newborns (shared) ------------
    # The same predictor step as the newborn cohorts (decided 10-11-2026, so
    # the JGZ kloof uses the same x-axis as the other products): parental
    # income = the mother's household income in the year before birth and the
    # year of birth, deflated to cpi_base_year and ranked WITHIN BIRTH YEAR
    # (income_parents_perc); parental wealth in the birth year; migration
    # background (third generation via the mother); household type at
    # childhood_home_age (number of parents); parents' education.
    # Income years must cover (first birth year - 1) to (last birth year).
    cpi_base_year: 2024
    parent_income_year_min: 2004
    parent_income_year_max: 2018
    parent_wealth_year_min: 2005
    parent_wealth_year_max: 2018
    # age (years) at which household type and parents' education are taken
    # (0 = in the birth year, as the newborns)
    childhood_home_age: 0

    # --- 03_outcomes_jgz.R ------------------------------------------------------
    # Outcome list: JGZ_outcomes_concept.xlsx (SharePoint, Background info
    # preprocessing JGZ, 10-11-2026). Variable names y_m<age in months>_<outcome>;
    # file names add the version prefix (Y_1_0_m24_bmi_p90). The bereik outcomes
    # are in config/jgz_catchment.yml.
    #
    # One measurement per child per age: the one closest to the nominal age
    # (outcome_target_days) among the contact moments listed for that age
    # (decided 23-10-2026), per item when an age combines several items. The
    # contact-moment windows are those of 01c_contact_moments.R.
    outcome_target_days: {m1: 28, m2: 56, m3: 90, m4: 120, m6: 181, m9: 273, m11: 334, m14: 426, m18: 547,
                          m24: 730, m36: 1095, m45: 1368, m60: 2190, m120: 3819, m162: 5140}

    # BMI (y_m<age>_bmi, _bmi_p90, _bmi_p10). Outliers: |z| > bmi_z_max, z
    # within age x sex, are set to missing (as the map tables). The p90 and
    # p10 cut-offs are computed over all children measured at that age, so they
    # are the same for every area (27-10-2026); within sex (TRUE) or boys and
    # girls together (FALSE, as Coen) -- to confirm with Bastian.
    # Infant contacts added 11-11-2026 (all well filled in the 2019 descriptives,
    # 22k-43k per contact). m1 = 4 weeks, m2 = 8 weeks; the 7.5-month visit falls
    # in the 6-month window of 01c, so it has no age of its own.
    bmi_ages: {m1: ["4wks"], m2: ["8wks"], m3: ["3months"], m4: ["4months"], m6: ["6months"],
               m9: ["9months"], m11: ["11months"], m14: ["14months"], m18: ["18months"],
               m24: ["2years"], m36: ["3years"], m45: ["3years9m"],
               m60: ["groep2"], m120: ["groep7"], m162: ["klas2"]}
    bmi_z_max: 5
    bmi_cutoffs_by_sex: TRUE

    # Van Wiechen items, scored + / - / M (M = only reported by the parent).
    # Two binary outcomes per item (Bastian, 20-10-2026):
    #   y_m<age>_<item>_can     = + or M  (can, according to professional or parent)
    #   y_m<age>_<item>_notseen = - or M  (not seen by the professional)
    # Items without an M option (wiechen_no_m) get one outcome: y_m<age>_<item>
    # = + (seen by the professional). y_m<age>_language_delay = at least one
    # item of that age scored -.
    # NB disclosure: _can and _notseen of one item together with N give all
    # three categories; decide with Bastian which is exported.
    # Items and ages follow the filled cells of the 2019 descriptives (sheet D8.2,
    # "20190208BR Descriptives bijgeschaafd.xlsx"; checked 11-11-2026): 41/42 at
    # 2 years, 45/46 at 3 years, 48/49/50 at 3y9m.
    wiechen_ages: {m24: ["18months", "2years"], m36: ["3years"], m45: ["3years", "3years9m"]}
    wiechen_items:
      m24: {words2: "zin2w", bodyparts: "pop6", me_i: "noemt", pictures: "wijstaan"}
      m36: {words3: "zin3w", intelligible_familiar: "verstaan1"}
      m45: {questions: "vragen1", intelligible: "verstaan2", questions2: "vragen2"}
    # items 44 (wijstaan) and 49 (verstaan2) are only scored + / -
    wiechen_no_m: ["intelligible", "pictures"]

    # SDQ total score (y_m<age>_sdq<cutoff> = score >= cutoff). Scores above
    # sdq_max are impossible (range 0-40) and set to missing. At 3y9m (11k
    # scores in the 2019 descriptives) part of the questionnaires is the DMO
    # protocol instead of the SDQ (sheet D8.6).
    sdq_ages: {m45: ["3years9m"], m60: ["groep2"], m120: ["groep7"], m162: ["klas2"]}
    sdq_cutoff: 11
    sdq_max: 40

    # Visus: y_m<age>_visus = 1 when the conclusion of the vision test (visus_c)
    # is in visus_abnormal, 0 when it is in visus_normal, missing otherwise.
    # Codebook: 1 voldoende, 2 twijfelachtig, 3 onvoldoende. Default:
    # "afwijkend" = onvoldoende; twijfelachtig counts as not abnormal -- to confirm.
    # Not at groep 2: only 545 conclusions there (2019 descriptives, D8.3); the
    # vision test at groep 2 is recorded as a Landolt-C result instead (11-11-2026).
    visus_ages: {m36: ["3years"], m45: ["3years9m"]}
    visus_abnormal: ["3", "onvoldoende"]
    visus_normal: ["1", "2", "voldoende", "twijfelachtig"]

  file_locations:
    # Intermediate files per step (01_cohort.rds, 02_predictors.rds, ...) and
    # the final cohort file (output/jgz_cohort.rds), as for every cohort
    temp_folder: "temp/jgz"
    output_folder: "output"

    # --- raw JGZ files (01a) --------------------------------------------------
    id_file:      "L:/8151mcuniekCBKV2.SAV"
    id_file_zonl: "L:/8151ZOrggroepOudeenNieuweLanduniekCBKV1.SAV"
    health_file:  "L:/8151GezondheidsbestandxV2CBKV1.SAV"

    # Working folder for the cleaning diagnostics (switch matrices, merges,
    # FRANKENSTEIN file)
    work_folder:        "H:/JGZ-Pilot-Data"
    descriptives_folder: "H:/JGZ-Pilot-Data/Descriptives Results"

    # --- outputs of 01a-01c (also read by config/jgz_catchment.yml and by the
    # map tables in Opportunity-Analysis-Map/JGZ) --------------------------------
    # 01a: one row per child (RIN) x age (leeftijd)
    panel_file: "H:/JGZ-Panel-Data/JGZ_panel.rds"
    # 01a, saved before any collapse: the cleaned health measurements (one row
    # per record, key measurement_id) and the cleaned ID file (child ID -> RIN),
    # so collapse and merge rules can be revisited without rerunning the cleaning
    measurements_file: "H:/JGZ-Panel-Data/JGZ_measurements_clean.rds"
    id_link_file: "H:/JGZ-Panel-Data/JGZ_id_link.rds"
    # 01b: panel plus GBA address and postcode at each contact moment
    panel_postcode_file: "H:/JGZ-Pilot-Data/jgz_gba_postcode_data.rds"
    # 01c: one .rds per contact moment (input of 03 and of the map tables)
    contact_moment_folder: "H:/JGZ-Pilot-Data/contact_moments"

    # --- CBS microdata ------------------------------------------------------------
    # Same versions as the prim8 and newborn pipelines, read from the SQLite
    # versions (.db, "geconverteerde data"). To read a .sav instead (slower,
    # same result), point to the .sav, e.g.
    # "Bevolking/GBAPERSOONTAB/2024/GBAPERSOON2024TABV3.sav". The address and
    # postcode files must cover the latest contact date in the JGZ data.
    data_folder:      "G:/"
    # 01b, 01d (read with read_cbs_jgz() in src/jgz/jgz_helpers.R)
    gba_persoon_file: "Bevolking/GBAPERSOONTAB/2024/geconverteerde data/GBAPERSOON2024TABV3.db"
    gba_adres_file:   "Bevolking/GBAADRESOBJECTBUS/geconverteerde data/GBAADRESOBJECT2024BUSV1.db"
    vslpostcode_file: "BouwenWonen/VSLPOSTCODEBUS/geconverteerde data/VSLPOSTCODEBUSV2026031.db"
    kindouder_file:   "Bevolking/KINDOUDERTAB/geconverteerde data/KINDOUDER2025TABV2.db"
    # 02 (src/newborns/02_predictors_newborns, names as in the newborn configs)
    gba_data:       "Bevolking/GBAPERSOONTAB/2024/geconverteerde data/GBAPERSOON2024TABV3.db"
    household_data: "Bevolking/GBAHUISHOUDENSBUS/Geconverteerde bestanden/GBAHUISHOUDENS2024BUSV1.db"
    cpi_index_data: "resources/Consumentenprijzen__prijsindex_2015_100_14112022_221558.xlsx"
    opleiding_data: "K:/Utilities/Code_Listings/SSBreferentiebestanden/OPLEIDINGSNRREFV36.SAV"
    cto_data:       "K:/Utilities/Code_Listings/SSBreferentiebestanden/CTOREFV13.SAV"

  pipeline:
    # The steps P_2_1_run_all.R runs for the JGZ cohort, in this order. Step 01
    # has four parts (01a-01d); `Rscript src/lib/P_2_1_run_cohort.R jgz 01` runs
    # all four. Step 02 is the predictor step of the newborn cohorts.
    script_dir: "src/jgz"
    scripts: ["01a_clean_and_merge", "01b_add_gba_postcode", "01c_contact_moments", "01d_cohort_jgz",
              "../newborns/02_predictors_newborns", "03_outcomes_jgz", "04_postprocessing_jgz"]

  final_checks:
    # Checked on output/jgz_cohort.rds at the end of the run (check_final_cohort())
    expected_columns: ["income_parents_perc", "migration_background", "type_household", "parents_education",
                       "y_m24_bmi", "y_m24_bmi_p90", "y_m24_bmi_p10", "y_m36_bmi_p90", "y_m45_bmi_p90",
                       "y_m60_bmi_p90", "y_m120_bmi_p90", "y_m162_bmi_p90",
                       "y_m1_bmi_p90", "y_m6_bmi_p90", "y_m18_bmi_p90",
                       "y_m24_words2_can", "y_m24_words2_notseen", "y_m24_bodyparts_can", "y_m24_bodyparts_notseen",
                       "y_m24_me_i_can", "y_m24_me_i_notseen", "y_m24_pictures",
                       "y_m24_language_delay", "y_m36_words3_can", "y_m36_words3_notseen",
                       "y_m36_intelligible_familiar_can", "y_m36_intelligible_familiar_notseen", "y_m36_language_delay",
                       "y_m45_questions_can", "y_m45_questions_notseen",
                       "y_m45_intelligible", "y_m45_questions2_can", "y_m45_questions2_notseen",
                       "y_m45_language_delay", "y_m45_sdq11", "y_m60_sdq11", "y_m120_sdq11", "y_m162_sdq11",
                       "y_m36_visus", "y_m45_visus",
                       "pc4_m24", "pc4_m36", "pc4_m45", "org_m24", "org_m36", "org_m45"]
    ranges:
      birthdate: [child_birth_date_min, child_birth_date_max]
