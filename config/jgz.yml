# Configuration for the JGZ (youth health care) pilot pipeline in src/jgz.
#
# All scripts in src/jgz are run from the repository root, e.g.
#   setwd("H:/Opportunity-Preprocessing"); source("src/jgz/00_clean_and_merge.R")
# and read this file with config::get(). Change paths here, not in the scripts.
#
# Paths below are the ones that were hard-coded in the scripts before the
# 2026-10 rewrite (see git history for the old versions). Where the old
# scripts used different folders for the same thing, the choice made is noted.

default:
  settings:
    # --- 00_clean_and_merge.R -----------------------------------------------
    # CBS stand-in hash for an empty child ID (confirmed with CBS, see
    # archive/jgz_data_clean_merge.R). Rows in the ID file with this value
    # are dropped. Set to "" to disable.
    placeholder_hash: "07a6b530b148d85858a02420de14c297"

    # Category-3 ("fill empty") variables that are strings: the Stata do-file
    # fills with the first sorted value, which is "" whenever any row in the
    # contact moment is empty -- i.e. it blanks real values instead of
    # filling them. FALSE (default) fills with the group's non-empty value,
    # as intended. TRUE reproduces the Stata behaviour exactly.
    replicate_stata_string_fill: FALSE

    # --- 02_create_excel_info_maps.R ------------------------------------------
    # Minimum number of observations per published cell (CBS output rule).
    min_cell: 10
    # Coding of `geslacht` in the JGZ data (the 4-weeks block of the old
    # script used 1/2; the other blocks compared against text labels, which
    # never matched). Check with table(jgz$geslacht) and adjust if needed.
    sex_boy: 1
    sex_girl: 2
    # BMI outlier rule: drop |z| > this, z computed within contact moment x sex
    bmi_z_max: 5
    # Top-10% BMI flag: 90th percentile within sex (TRUE) or over boys and
    # girls together (FALSE, as Coen's gradient do-file). Bastian (20 Oct):
    # "the whole group" -- confirm which is meant.
    bmi_p90_by_sex: TRUE
    # Contact-moment windows: "fixed" (age windows of the old script) or
    # "histogram" (Coen's histogram/dal method, cut at the lowest point between
    # the peaks of the age distribution). Both are written to
    # contact_moment_windows.xlsx for comparison.
    cm_method: "fixed"
    # One measurement per child per window: closest to the nominal age
    # ("nominal", Bastian 30 Sep) or to the peak of the window ("peak", Coen)
    cm_target: "nominal"
    # SDQ cut-offs
    sdq_cutoffs: [11, 14]

    # --- 05_final.R -----------------------------------------------------------
    # Organisations whose results may be exported (6 LimburgNoord, 7 ZONL,
    # 10 Verian, 12 Icare). Only include organisations that gave permission.
    export_orgs: [7, 10]
    # Also export pooled results (all organisations together)? Only when every
    # organisation in the pool gave permission.
    export_pooled: FALSE
    # Also export "excluding organisation X" results for the orgs above?
    export_excl: FALSE

    # --- 06_build_catchment_sample.R ---------------------------------------------
    # Rebuilds Data_CatchmentArea_3pooled_withvariables (Coen, Sept 2020) for
    # the bereik analyses. First reconstructed without Coen's do-files; on
    # 2026-10-23 checked against "20200916 SAMPLE SELECTION", "20200916 PREPARE
    # CHILD AND FAMILY CHARACTERISTICS" and "20200913 ANALYSIS 3 CONTACT
    # MOMENTS". The defaults below follow those do-files.
    #
    # Children born in this range are candidates (Coen: 2005-2018); the
    # cohort rule below narrows this down per organisation.
    catch_birth_date_min: "2005-01-01"
    catch_birth_date_max: "2018-12-31"
    # Contact-moment windows in completed months of age (calendar months since
    # the birth month, like Coen's %tm variables) -- as in SAMPLE SELECTION.
    catch_cm_windows:
      2y:   [22, 33]
      3y:   [34, 43]
      3y9m: [44, 53]
    # A child is in the sample when he/she lives continuously in the catchment
    # area of ONE organisation during the whole window (first to last month
    # above). Address spells that follow each other within this many months
    # count as continuous (1 = next spell starts in the same or next month;
    # Coen: "remove flag for records that start 1 month later").
    catch_max_gap_months: 1
    # An area counts until its `einde` in the PC4 file. Coen did not use
    # `aanvang` (FALSE); TRUE also requires the window to start after it.
    catch_use_aanvang: FALSE
    # TRUE: an area also stops counting after the last contact month of that
    # organisation in the JGZ panel. Coen used the cohort rule instead (FALSE).
    catch_use_data_end: FALSE
    # Birth cohorts per organisation ("coen" or "none"): per organisation the
    # share of children observed per birth month; first cohort = first month
    # with a drop in that share while above catch_cohort_min_share (2y window),
    # last cohort = last month with a rise while above it (3y9m window).
    catch_cohort_rule: "coen"
    catch_cohort_min_share: 0.8
    # Left out when computing the shares (Coen: Verian without Apeldoorn,
    # which is not in the data). The regression do-file drops Apeldoorn.
    catch_cohort_exclude:
      org: 10
      gemeente: ["Apeldoorn"]
    # Corrections to the PC4 file (Coen: Verian's 8080 is 8180; 8080 is
    # otherwise listed for both Verian and Icare)
    catch_pc4_corrections:
      - {org: 10, from: 8080, to: 8180}
    # "Observed" at a contact moment = at least one row in the JGZ panel (one
    # row = at least one recorded item) with an age within the window, any
    # organisation (as Coen). TRUE: only the catchment organisation itself.
    catch_observed_same_org: FALSE
    # Reference age for the "cm_" variables (income, household income, health
    # costs, addresses of child and parents, postcode_4): 36 months, as in
    # ANALYSIS 3 CONTACT MOMENTS (local age_months=36).
    catch_reference_age_months: 36
    # Year of the education file (HOOGSTEOPLTAB) for the parents (Coen: 2018)
    catch_education_year: 2018
    # Columns to keep from HOOGSTEOPLTAB (missing ones are skipped with a message)
    catch_education_cols: [OPLNRHB, OPLNRHG, OPLNIVSOI2016AGG4HBMETNIRWO,
                           OPLNIVSOI2016AGG4HGMETNIRWO, RICHTPLTSHBMETNIRWO, GEWICHTHOOGSTEOPL]
    # Health costs as in Coen's PREPARE do-file: total = sum of these columns
    # (missing = 0); mental care = any of the second list not 0
    catch_health_cost_cols: [ZVWKHUISARTS, ZVWKFARMACIE, ZVWKMONDZORG, ZVWKZIEKENHUIS,
                             ZVWKPARAMEDISCH, ZVWKHULPMIDDEL, ZVWKZIEKENVERVOER, ZVWKGEBOORTEZORG,
                             ZVWKBUITENLAND, ZVWKOVERIG, ZVWKEERSTELIJNSPSYCHO, ZVWKGGZ,
                             ZVWKGENBASGGZ, ZVWKSPECGGZ, ZVWKGERIATRISCH, ZVWKWYKVERPLEGING]
    catch_mental_care_cols: [ZVWKEERSTELIJNSPSYCHO, ZVWKGGZ, ZVWKGENBASGGZ, ZVWKSPECGGZ,
                             NOPZVWKGGZMV, NOPZVWKGGZZVINST, NOPZVWKGGZZVZELF, NOPZVWKGGZOVERIG]

  file_locations:
    # --- raw CBS microdata (00) ---------------------------------------------
    id_file:      "L:/8151mcuniekCBKV2.SAV"
    id_file_zonl: "L:/8151ZOrggroepOudeenNieuweLanduniekCBKV1.SAV"
    health_file:  "L:/8151GezondheidsbestandxV2CBKV1.SAV"

    # Working folder for intermediate files and the cleaning diagnostics.
    # (The old 00 wrote to "H:/JGZ-Pilot-Data", "H:/JGZ-Data-Pilot" and
    # "H:/JGZ-Pilot_Data" -- the first one is used here.)
    work_folder:        "H:/JGZ-Pilot-Data"
    descriptives_folder: "H:/JGZ-Pilot-Data/Descriptives Results"

    # Final panel: one row per child (RIN) x age (leeftijd). Output of 00,
    # input of 01.
    panel_file: "H:/JGZ-Panel-Data/JGZ_panel.rds"

    # --- address / postcode (01) -------------------------------------------
    # Address history. Must cover the latest contact date in the JGZ data
    # (2018 in the pilot).
    gbaadres_file: "G:/Bevolking/GBAADRESOBJECTBUS/GBAADRESOBJECT2018BUSV1.dta"
    # rinobjectnummer -> postcode lookup, produced outside R (see 01, step 3)
    matched_postcode_file: "H:/JGZ-Pilot-Data/matched_postcode.dta"
    # Panel with postcode at each contact moment. Output of 01, input of 02.
    panel_postcode_file: "H:/JGZ-Pilot-Data/jgz_gba_postcode_data.rds"

    # --- map tables (02) ----------------------------------------------------
    # One .rds per contact moment (the old script wrote these to scratch/JGZ)
    contact_moment_folder: "scratch/jgz"
    # Excel workbooks with BMI / Wiechen / SDQ per PC3 and PC4. Output of 02,
    # input of 05.
    maps_folder: "H:/JGZ-Pilot-Data/Descriptives Results/excel-info-maps"

    # --- gradients (03, 04) ---------------------------------------------------
    # Folder with the gradient Excel output. The old 03 used
    # "H:/Archive/Sonya/JGZ-Pilot-Data/Gradients Analysis Results" while 04
    # and 05 used the folder below; one folder is used for all three now.
    gradients_folder: "H:/JGZ-Pilot-Data/Gradients Analysis Results"

    # --- final export bundle (05) -----------------------------------------
    proportions_folder:  "H:/Archive/Sonya/JGZ pilot data/Proportions Results"
    bereik_folder:       "H:/Archive/Sonya/JGZ pilot data/Bereik Regression Results"
    export_descriptives_folder: "H:/Archive/Sonya/JGZ pilot data/Descriptives Results"
    export_folder:       "H:/Archive/Sonya/Export JGZ"

    # --- catchment area ---------------------------------------------------
    # SQLite version of VSLPOSTCODEBUS (see catchment_area_calculations.R)
    catchment_postcode_db: "G:/BouwenWonen/VSLPOSTCODEBUS/VSLPOSTCODEBUS2026031.db"
    catchment_postcode_table: ""   # "" = use the only table in the .db
    catchment_persoon_file: "G:/Bevolking/GBAPERSOONTAB/2017/geconverteerde data/GBAPERSOON2017TABV1.DTA"
    catchment_adres_file:   "G:/Bevolking/GBAADRESOBJECTBUS/2017/geconverteerde data/GBAADRESOBJECT2017BUSV1.dta"
    catchment_output:       "H:/JGZ-Pilot-Data/Descriptives Results/CatchmentArea.xlsx"

    # --- 06_build_catchment_sample.R ---------------------------------------------
    # Root of the CBS microdata; yearly files (INPA, IPI, INHA, HOOGSTEOPL,
    # ZVWZORGKOSTEN) are found below it, latest version per year, as in the
    # other pipelines of this repository.
    data_folder: "G:/"
    catch_gba_persoon_file: "Bevolking/GBAPERSOONTAB/2023/GBAPERSOON2023TABV1.sav"
    catch_gba_adres_file:   "Bevolking/GBAADRESOBJECTBUS/GBAADRESOBJECT2023BUSV1.sav"
    catch_vslpostcode_file: "BouwenWonen/VSLPOSTCODEBUS/VSLPOSTCODEBUSV2025031.sav"
    catch_kindouder_file:   "Bevolking/KINDOUDERTAB/KINDOUDER2023TABV1.sav"
    # PC4 -> organisation with coverage dates (org, gemeente, postcode_4, aanvang, einde)
    catch_pc4_org_file:     "resources/jgz_pc4gebieden.csv"
    # Country -> western / non-western (fallback for ETNGRP)
    catch_land_ref_file:    "resources/LANDAKTUEELREF10.sav"
    # CBS reference files used by Coen. When they exist, ETNGRP and
    # pa_/ma_ISCED2011LevelHB are built exactly as in his do-files; otherwise
    # ETNGRP comes from the fallback above and ISCED stays empty. Check the
    # versions available in RA.
    catch_land_etngrp_file: "K:/Utilities/Code_Listings/SSBreferentiebestanden/Geconverteerde data/LANDAKTUEELREFV9.dta"
    catch_oplnr_ref_file:   "K:/Utilities/Code_Listings/SSBreferentiebestanden/Geconverteerde data/OPLEIDINGSNRREFV24.dta"
    catch_cto_ref_file:     "K:/Utilities/Code_Listings/SSBreferentiebestanden/Geconverteerde data/CTOREFV8.dta"
    # Output: Stata file with the variable names of Coen's dataset (read by the
    # bereik regression do-file) and an .rds copy
    catch_sample_file:      "H:/JGZ-Pilot-Data/Data_CatchmentArea_3pooled_withvariables_R.dta"
