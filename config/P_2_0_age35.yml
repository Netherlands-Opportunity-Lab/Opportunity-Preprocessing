# Files that have a converted SQLite version point to that .db (read with read_cbs(), see src/sql_helpers.R).
# Still .sav (no .db of exactly this version yet):
#   Bevolking/KINDOUDERTAB/KINDOUDER2024TABV1.sav
#   BouwenWonen/VSLPOSTCODEBUS/VSLPOSTCODEBUSV2025031.sav
#   BouwenWonen/LEVCYCLWOONNIETWOONBUS/LEVCYCLWOONNIETWOONBUSV2024122.sav
# read_cbs() reads these with read_sav() and filters in R. Pointing them to a .db is a config change only.
default:
  data_preparation:
    # The name of the cohort
    cohort_name: "age35"
    
    # Child birth date filters the cohort by age
    child_birth_date_min: "01/01/1985"
    child_birth_date_max: "31/12/1989"

    # The cohort should live continuously in NL in the following period
    child_live_start: 34
    child_live_end: 35

    # The cohort is allowed to be unregistered for this many days 
    # in this period
    child_live_slack_days: 31
    
    # take the address registration on a specific age
    childhood_home_age: 15
    
    # Postal code link to homes will be considered on this target date
    postcode_target_date: "31/12/2025"
    # Neighbourhood geo link to homes will be considered on this target date
    gwb_target_date: "31/12/2025"
    # Corop geo link to homes will be considered on this target date
    corop_target_date: "31/12/2025"
    
    # Income will be deflated to cpi_base_year euros.
    cpi_base_year: 2024
    
    # Parent income year range
    parent_income_year_min: 2003
    parent_income_year_max: 2007
    
    # Parent wealth year range
    parent_wealth_year_min: 2006
    parent_wealth_year_max: 2010
    
    # child age at which we measure the outcome
    outcome_age: 35
    
    # The parents education will be added to to the cohort
    education_parents: false
    
    # Child income year range
    child_income_year_min: 2019
    child_income_year_max: 2024
    
    # Child outome year range
    child_outcome_year_min: 2020
    child_outcome_year_max: 2024

    # age at which we measure health outcomes
    health_outcome_age: 34
    # health outcomes year range, one year before last time in 8th grade
    health_year_min: 2019
    health_year_max: 2023
    
    # gifts received year range
    gifts_dat_start: 2007
    gifts_dat_end: 2022
    gifts_year_start: 22
    gifts_year_end: 33
    
    
  file_locations:
    # The data folder is the root folder of the cbs microdata tables
    data_folder: "G:/"
    # The scratch folder is used to write intermediate output
    temp_folder: "temp/age35"
    # The final cohort file (<cohort>_cohort.rds) is written here
    output_folder: "output"
    
    # path to the cbs microdata
    gba_data: "Bevolking/GBAPERSOONTAB/2024/geconverteerde data/GBAPERSOON2024TABV3.db"
    gbaao_data: "Bevolking/GBAADRESOBJECTBUS/geconverteerde data/GBAADRESOBJECT2024BUSV1.db"
    kind_data: "Bevolking/KINDOUDERTAB/KINDOUDER2024TABV1.sav"
    postcode_data: "BouwenWonen/VSLPOSTCODEBUS/VSLPOSTCODEBUSV2025031.sav"
    vslgwb_data: "BouwenWonen/VSLGWBTAB/geconverteerde data/VSLGWB2025TAB03V1.db"
    household_data: "Bevolking/GBAHUISHOUDENSBUS/geconverteerde data/GBAHUISHOUDENS2024BUSV1.db"
    # SPOLISBUS (yearly): folder with your converted SPOLISBUS<year>V<n>.db files, made with
    # convert_files_to_sqlite/savtosqlite.py. Leave empty to only look in 'geconverteerde data'
    # next to the .sav. Years without a .db of the same version are read from the .sav.
    spolis_db_folder: ""
    # SECMBUS: converted with convert_files_to_sqlite/savtosqlite.py. Until CBS has moved it to
    # 'geconverteerde data', put the full path here (e.g. "H:/.../SECMBUS2024V1.db"); the
    # .SAV path also works (then read_cbs() falls back to read_sav()).
    secm_data: "InkomenBestedingen/SECMBUS/geconverteerde data/SECMBUS2024V1.db"
    woon_data: "BouwenWonen/LEVCYCLWOONNIETWOONBUS/LEVCYCLWOONNIETWOONBUSV2024122.sav"
    poverty_data: "InkomenBestedingen/INHARMATAB/"

    # resources
    cpi_index_data: "resources/Consumentenprijzen__prijsindex_2015_100_14112022_221558.xlsx"
    migration_data: "K:/Utilities/Code_Listings/SSBreferentiebestanden/LANDAKTUEELREFV13.SAV"
    corop_data: "K:/Utilities/HULPbestanden/GebiedeninNederland/GIN"

  pipeline:
    # The scripts that P_2_1_run_all.R runs for this cohort, in this order. Names
    # without the version prefix (P_2_0_, P_2_1_), which only exists outside the RA.
    script_dir: "src/age35"
    scripts: ["01_cohort_age35", "02_predictors_age35", "03_outcomes_age35", "04_postprocessing_age35"]
    # Robustness checks (lifecycle bias), run after the pipeline when the folder
    # exists. The scripts are only in the RA, not on GitHub.
    robustness_dir: "src/age35/robustness"
    robustness_scripts: ["02a", "03a", "03b"]
